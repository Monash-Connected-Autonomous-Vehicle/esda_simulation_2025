# IGVC waypoints: no-man's-land start/end and ramp start/end.
# All poses are in the map frame, whose origin is the robot's starting pose
# (as with a fresh SLAM map).
#
# waypoints - SIM (igvc.sdf, and igvc_campus.sdf which places the same track
#   at the same pose). Measured from the orange_igvc ground texture
#   (1400 x 1200 px over 43 x 37 m; mapping checked against the barrel poses
#   in model.sdf), relative to the spawn at world (11, 0), yaw 0. The robot
#   drives east, up the right side, then WEST along the top straight, which
#   has the same layout as the competition's east side: lanes end, barricade,
#   bracket-shaped lane segments where the ramp would be (there is no ramp
#   model in the sim), barricade, lanes resume.
#   no_mans_land_* = midpoint between the two lane-line ends,
#   ramp_* = centre of each bracket opening. Accuracy ~0.2 m.
#   The previous goal_1 (4.168, 29.937) lands within 0.15 m of
#   no_mans_land_start, an independent check.
#
# competition_northbound / competition_southbound - the REAL course, from the
#   competition photo. Scale from parking stalls (40 px = 9 ft = 2.743 m),
#   origin at the Start mark, robot starting facing north / south.
#   APPROXIMATE (1-2 m); verify on site or with GPS. Not valid in the sim.

